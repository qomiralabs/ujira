name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # pnpm is installed from the @pnpm/exe.linux-x64 tarball, the package that
  # holds the binary; the `pnpm` npm package is only a shim around it.
  # PNPM_EXE_SHA512 is the SHA-512 of that tarball for PNPM_VERSION, which
  # must match packageManager in package.json. Quoted so YAML never reads an
  # all digit hash as a number.
  PNPM_VERSION: 12.14.0
  PNPM_EXE_SHA512: '17a2bc7bf8d6c62b84609690b514541bdca70524c41dafadecb7fce8c2ae38ee5403b59554c6e2fa807c9d8ea2296fbe9dc592db21ba4fd7da5d91b1a8db1fa1'

jobs:
  # One job on purpose: a single runner and a single install keeps billed
  # minutes low on a private repo.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      # Installed by hand rather than with pnpm/action-setup, which checks
      # the download only against registry metadata and then self updates.
      # Runs before setup-node, whose pnpm cache already executes pnpm.
      - name: Set up pnpm
        run: |
          grep -Fq "\"packageManager\": \"pnpm@${PNPM_VERSION}+sha512." package.json
          curl -fsSLo pnpm.tgz "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-${PNPM_VERSION}.tgz"
          echo "${PNPM_EXE_SHA512}  pnpm.tgz" | sha512sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pnpm"
          tar -xzf pnpm.tgz -C "${RUNNER_TEMP}/pnpm" --strip-components 1 package/pnpm
          rm pnpm.tgz
          echo "${RUNNER_TEMP}/pnpm" >> "${GITHUB_PATH}"
          test "$("${RUNNER_TEMP}/pnpm/pnpm" --version)" = "${PNPM_VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # No dependency or workspace member needs an install script, and the
      # workspace check rejects them in members, so none run here.
      - name: Install
        run: |
          test "$(command -v pnpm)" = "${RUNNER_TEMP}/pnpm/pnpm"
          pnpm install --frozen-lockfile --ignore-scripts

      # Fails on any dependency outside the license allowlists, then fails
      # again if the committed notices are out of date.
      - name: Licenses
        run: |
          pnpm licenses:check
          git diff --exit-code THIRD_PARTY_NOTICES.md

      # Provenance manifests and XMP packets in images can name the program
      # that made them and never show up in a text diff.
      - name: Check embedded metadata
        run: pnpm metadata:check

      # Literal bidirectional controls and invisible characters can make code
      # read differently from how it runs.
      - name: Check invisible characters
        run: pnpm invisible:check

      - name: Typecheck
        run: pnpm typecheck

      # Gate steps may only write ignored output such as dist/. A change to a
      # tracked or new file means a step rewrote something later steps read.
      - name: Working tree unchanged after typecheck
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The JUnit report names every test and its result, so a flaky or slow
      # test can be identified from the artifact. It is written outside the
      # checkout.
      - name: Test with coverage
        run: pnpm test --reporter=verbose --reporter=junit --outputFile.junit="${RUNNER_TEMP}/vitest/junit.xml"

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-junit
          path: ${{ runner.temp }}/vitest/junit.xml
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # Upload even when tests fail so a threshold miss can be inspected. A
      # missing report is only an error when everything before this passed.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # The build uses its own tsconfig, so typecheck passing does not prove
      # the packages compile for release.
      - name: Build
        run: pnpm build

      # Gate steps may only write ignored output such as dist/. A change to a
      # tracked or new file means a step rewrote something later steps read.
      - name: Working tree unchanged after build
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Audit production dependencies
        run: pnpm audit --prod
