name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # pnpm is installed from the @pnpm/exe.linux-x64 tarball, the package that
  # holds the binary; the `pnpm` npm package is only a shim around it.
  # PNPM_EXE_SHA512 is the SHA-512 of that tarball for PNPM_VERSION, which
  # must match packageManager in package.json. Quoted so YAML never reads an
  # all digit hash as a number.
  PNPM_VERSION: 12.14.0
  PNPM_EXE_SHA512: '17a2bc7bf8d6c62b84609690b514541bdca70524c41dafadecb7fce8c2ae38ee5403b59554c6e2fa807c9d8ea2296fbe9dc592db21ba4fd7da5d91b1a8db1fa1'
  # SHA-512 of the pnpm binary inside that tarball. scripts/assert-pnpm.sh
  # checks it, with the path and version, at the start of every step that
  # runs pnpm.
  PNPM_BINARY_SHA512: '31d634f13f80f983b91922b35388744a11f5a3909f14b104f2aabb71cbff135e6ffc4db68f1192641da41a52f9296fb8377cd6d66bc009b73d0e4d54fc87df3d'
  # gitleaks is MIT licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Scans the whole history, not only the change, so it checks out every
  # commit. A key that was committed and later deleted, or added in a merge
  # resolution, still fails.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$tarball"
          version=$("${RUNNER_TEMP}/gitleaks/gitleaks" version)
          [ "$version" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks is $version, not ${GITLEAKS_VERSION}" >&2; exit 1; }
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      # On pull requests the rules come from the base branch, so a change
      # cannot loosen the rules its own scan runs with. Empty on pushes.
      - name: Scan the full history for secrets
        env:
          SECRET_SCAN_BASE_REF: ${{ github.base_ref }}
        run: scripts/secret-scan.sh

      # Plants generated fake keys in throwaway repos and checks the scan
      # fails on each, so a config change cannot quietly stop detection.
      - name: Test the secret scan
        if: ${{ !cancelled() }}
        run: scripts/secret-scan.test.sh

  # Every gate except the secret scan runs in this one job: a single runner
  # and a single install keeps billed minutes low on a private repo. The
  # secret scan is its own job because it needs the full history.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      # Every step that runs pnpm must start with scripts/assert-pnpm.sh.
      - name: Check workflow pnpm assertions
        run: |
          scripts/check-workflow-pnpm.sh
          scripts/check-workflow-pnpm.test.sh
          scripts/assert-pnpm.test.sh

      # The template every pull request starts from must keep asking for the
      # linked issue, tests, docs, the checklist and the required reviews.
      - name: Check the pull request template
        run: |
          scripts/check-pr-template.sh
          scripts/check-pr-template.test.sh

      # Installed by hand rather than with pnpm/action-setup, which checks
      # the download only against registry metadata and then self updates.
      # Runs before setup-node, whose pnpm cache already executes pnpm.
      - name: Set up pnpm
        run: |
          curl -fsSLo pnpm.tgz "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-${PNPM_VERSION}.tgz"
          echo "${PNPM_EXE_SHA512}  pnpm.tgz" | sha512sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pnpm"
          tar -xzf pnpm.tgz -C "${RUNNER_TEMP}/pnpm" --strip-components 1 package/pnpm
          rm pnpm.tgz
          echo "${RUNNER_TEMP}/pnpm" >> "${GITHUB_PATH}"
          PATH="${RUNNER_TEMP}/pnpm:${PATH}" scripts/assert-pnpm.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # package.json is parsed as strict JSON, so a duplicate packageManager
      # key fails instead of hiding behind the first one.
      - name: Check packageManager
        run: node scripts/check-package-manager.ts "${PNPM_VERSION}"

      # No dependency or workspace member needs an install script, and the
      # workspace check rejects them in members, so none run here.
      - name: Install
        run: |
          scripts/assert-pnpm.sh
          pnpm install --frozen-lockfile --ignore-scripts

      # Fails on any dependency outside the license allowlists, then fails
      # again if the committed notices are out of date.
      - name: Licenses
        run: |
          scripts/assert-pnpm.sh
          pnpm licenses:check
          git diff --exit-code THIRD_PARTY_NOTICES.md

      # Provenance manifests and XMP packets in images can name the program
      # that made them and never show up in a text diff.
      - name: Check embedded metadata
        run: |
          scripts/assert-pnpm.sh
          pnpm metadata:check

      # Literal bidirectional controls and invisible characters can make code
      # read differently from how it runs.
      - name: Check invisible characters
        run: |
          scripts/assert-pnpm.sh
          pnpm invisible:check

      - name: Typecheck
        run: |
          scripts/assert-pnpm.sh
          pnpm typecheck

      # Gate steps may only write ignored output such as dist/. A change to a
      # tracked or new file means a step rewrote something later steps read.
      - name: Working tree unchanged after typecheck
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      # This ceiling has been raised once already, from the runner's default
      # of about 2 GB to 6 GB, in #338. If you are here to raise it again,
      # the growth is the problem rather than the number.
      #
      # The type aware lint builds one TypeScript program per workspace
      # member and holds them all at once, so its peak memory grows with the
      # workspace. Two different measurements on two different machines,
      # which must not be blurred:
      #
      #   growth, peak resident size on one developer machine, same command:
      #   2,099,462,144 bytes at e3f6990 to 2,543,484,928 bytes with the
      #   embed package added, 21.1 percent for one member. The raw counts
      #   are here on purpose: both are 1.96 and 2.37 when rounded to two
      #   places, and a ratio of two rounded numbers cannot be trusted to a
      #   tenth of a percent. Dividing the rounded pair gives 18.5, which is
      #   arithmetically perfect and wrong.
      #
      #   headroom, on this runner: V8 printed a total heap of about 2,057
      #   MB as the ceiling it died against, with roughly 2,018 MB live.
      #
      # The first says how fast it grows, the second says how little room
      # was left. Neither is the other.
      #
      # Raising the ceiling is a stopgap. The fix is to build the programs
      # lazily rather than eagerly, which changes the shared ESLint
      # configuration and belongs in its own change, #343.
      #
      # The raise also removed the only thing reporting the growth: before
      # it, the lint announced each step by dying. So the peak is recorded
      # on every run and asserted well under the ceiling, and #343's trigger
      # is a reading rather than an outage.
      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          scripts/assert-pnpm.sh
          # The lint's own result must not depend on the measuring tool, so a
          # runner without it still lints; the missing reading fails below,
          # on its own, where it cannot be mistaken for a lint failure.
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -f '%M' -o "${RUNNER_TEMP}/lint-peak-kb" pnpm lint
          else
            rm -f "${RUNNER_TEMP}/lint-peak-kb"
            pnpm lint
          fi

      - name: Lint memory headroom
        if: ${{ !cancelled() }}
        env:
          # Well under the 6 GB ceiling, so the trend is reported with room
          # to act rather than at the moment it runs out.
          LINT_PEAK_LIMIT_KB: '4194304'
        run: |
          if [ ! -f "${RUNNER_TEMP}/lint-peak-kb" ]; then
            echo "the lint peak was not recorded, so the growth in #343 is unobserved" >&2
            exit 1
          fi
          peak=$(cat "${RUNNER_TEMP}/lint-peak-kb")
          echo "lint peak resident size: ${peak} kB, limit ${LINT_PEAK_LIMIT_KB} kB"
          if [ "$peak" -gt "${LINT_PEAK_LIMIT_KB}" ]; then
            echo "The type aware lint is within a third of its ceiling. See #343." >&2
            exit 1
          fi

      - name: Format check
        run: |
          scripts/assert-pnpm.sh
          pnpm format:check

      # The build uses its own tsconfig, so typecheck passing does not prove
      # the packages compile for release. It runs before the tests, and so
      # does every other check: test files are member code, and once they
      # have run, ignored folders such as node_modules may have changed.
      - name: Build
        run: |
          scripts/assert-pnpm.sh
          pnpm build

      # Gate steps may only write ignored output such as dist/. A change to a
      # tracked or new file means a step rewrote something later steps read.
      - name: Working tree unchanged after build
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Audit production dependencies
        run: |
          scripts/assert-pnpm.sh
          pnpm audit --prod

      # Test files are member code, so the checkout, node_modules included,
      # is mounted read-only for this step against ordinary writes from a
      # test. It does not stop a test that uses sudo to remount, or writes to
      # the pnpm store outside the checkout; those are a known gap tracked
      # separately. The JUnit report, the coverage report and the Vitest cache
      # are written outside the checkout.
      # The JUnit report names every test and its result, so a flaky or slow
      # test can be identified from the artifact.
      - name: Test with coverage
        run: |
          scripts/assert-pnpm.sh
          touch "${RUNNER_TEMP}/before-test"
          sudo mount --bind "${PWD}" "${PWD}"
          trap 'sudo umount "${PWD}"' EXIT
          sudo mount -o remount,bind,ro "${PWD}"
          pnpm test --coverage.reportsDirectory="${RUNNER_TEMP}/coverage" --reporter=verbose --reporter=junit --outputFile.junit="${RUNNER_TEMP}/vitest/junit.xml"

      # A backstop for the read-only mount: nothing in the checkout, tracked,
      # untracked or ignored, may change while the tests run. It compares
      # ctime, which touch cannot set back; a privileged writer can still
      # hide a change, as noted above.
      - name: Working tree and node_modules unchanged after test
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi
          newer="$(find . -mindepth 1 -path ./.git -prune -o -cnewer "${RUNNER_TEMP}/before-test" -print)"
          if [ -n "$newer" ]; then
            echo "$newer"
            exit 1
          fi

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-junit
          path: ${{ runner.temp }}/vitest/junit.xml
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # Upload even when tests fail so a threshold miss can be inspected. A
      # missing report is only an error when everything before this passed.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

  # The embed widget is the only surface that ships as a file on someone
  # else's page, so its budget and its browser tests run on every change. A
  # separate job because it needs a browser, which the verify job does not.
  embed:
    name: Embed widget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same hand installation and check as the verify job: the download
      # is verified against a pinned hash before anything runs it.
      - name: Set up pnpm
        run: |
          curl -fsSLo pnpm.tgz "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-${PNPM_VERSION}.tgz"
          echo "${PNPM_EXE_SHA512}  pnpm.tgz" | sha512sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pnpm"
          tar -xzf pnpm.tgz -C "${RUNNER_TEMP}/pnpm" --strip-components 1 package/pnpm
          rm pnpm.tgz
          echo "${RUNNER_TEMP}/pnpm" >> "${GITHUB_PATH}"
          PATH="${RUNNER_TEMP}/pnpm:${PATH}" scripts/assert-pnpm.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: |
          scripts/assert-pnpm.sh
          pnpm install --frozen-lockfile --ignore-scripts

      # Fails above 60 KB gzipped. The widget is built in memory, so this
      # writes nothing into the checkout.
      - name: Size budget
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/embed size

      - name: Install Chromium
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/embed exec playwright install --with-deps chromium

      # Theming, accessibility in both modes, the 320px layout and the time to
      # interactive on a throttled connection.
      - name: Browser tests
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/embed e2e

      # Light and dark at every review width, for the design review on the
      # pull request.
      - name: Screenshots
        if: ${{ !cancelled() }}
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/embed screenshots "${RUNNER_TEMP}/embed-screenshots"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embed-screenshots
          path: ${{ runner.temp }}/embed-screenshots/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # On a failure this carries the diff of the visual snapshot and the
      # trace of every failed test.
      - name: Upload the browser test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embed-playwright-report
          path: |
            packages/embed/playwright-report/
            packages/embed/test-results/
            packages/embed/e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14

  # The dashboard's browser checks: the route bundle budget, Playwright flows,
  # visual snapshots and axe in light and dark, and Lighthouse CI. Its own job
  # so the browsers it downloads never touch the verify job's read-only test
  # step, and so it runs alongside it.
  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: |
          curl -fsSLo pnpm.tgz "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-${PNPM_VERSION}.tgz"
          echo "${PNPM_EXE_SHA512}  pnpm.tgz" | sha512sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pnpm"
          tar -xzf pnpm.tgz -C "${RUNNER_TEMP}/pnpm" --strip-components 1 package/pnpm
          rm pnpm.tgz
          echo "${RUNNER_TEMP}/pnpm" >> "${GITHUB_PATH}"
          PATH="${RUNNER_TEMP}/pnpm:${PATH}" scripts/assert-pnpm.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: |
          scripts/assert-pnpm.sh
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: |
          scripts/assert-pnpm.sh
          pnpm build

      # Fails when any route loads more than 250 kB of JavaScript, gzipped.
      - name: Route bundle budget
        run: |
          scripts/assert-pnpm.sh
          pnpm budget:check

      - name: Install Playwright Chromium
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/dashboard exec playwright install --with-deps chromium

      # Flows, visual snapshots at 375, 768 and 1440 wide in light and dark,
      # and axe with zero violations in both modes.
      - name: Playwright
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/dashboard exec playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Reports stay on the runner and in the artifact; nothing is uploaded to
      # a public Lighthouse server.
      - name: Lighthouse CI
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/dashboard exec lhci autorun

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/dashboard/.lighthouseci/reports/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # Proves the budget check can fail: a build with the fixture route, which
      # imports every Lucide icon, must be rejected and the route named. Runs
      # last because it replaces the build the steps above used.
      - name: Route bundle budget fails a route over budget
        env:
          UJIRA_BUDGET_FIXTURE: '1'
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/dashboard exec next build
          if pnpm budget:check > "${RUNNER_TEMP}/budget.txt"; then
            cat "${RUNNER_TEMP}/budget.txt"
            echo "the budget check passed a route over budget" >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/budget.txt"
          grep -E '^  /budget-fixture +[0-9.]+ kB  over budget$' "${RUNNER_TEMP}/budget.txt"
  # Fails on any em dash or en dash in a tracked file's content or its path.
  # The same scripts run in every UJIRA repository. The self test runs first,
  # so the check's result is only trusted once the check is known to fail when
  # it should, and the second step reports even when the first fails.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the dash check
        run: scripts/test-check-dashes.sh

      - name: Check for dashes
        if: ${{ !cancelled() }}
        run: scripts/check-dashes.sh

  # The component catalogue: it builds, every story passes axe in light and
  # dark, the keyboard focus ring shows, and the screenshots still match.
  # Runs in the Playwright image so the snapshots are compared against the
  # same fonts and renderer they were taken with.
  catalogue:
    name: Catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: |
          curl -fsSLo pnpm.tgz "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-${PNPM_VERSION}.tgz"
          echo "${PNPM_EXE_SHA512}  pnpm.tgz" | sha512sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pnpm"
          tar -xzf pnpm.tgz -C "${RUNNER_TEMP}/pnpm" --strip-components 1 package/pnpm
          rm pnpm.tgz
          echo "${RUNNER_TEMP}/pnpm" >> "${GITHUB_PATH}"
          PATH="${RUNNER_TEMP}/pnpm:${PATH}" scripts/assert-pnpm.sh

      - name: Install
        run: |
          scripts/assert-pnpm.sh
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the catalogue
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/ui build-storybook

      # Every story in light and dark: axe with no violations, the saffron
      # focus ring on keyboard focus, and the committed screenshots.
      - name: Test the catalogue
        run: |
          scripts/assert-pnpm.sh
          pnpm --filter @ujira/ui test-storybook

      - name: Upload the catalogue report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-report
          path: |
            packages/ui/playwright-report/
            packages/ui/test-results/
          if-no-files-found: ignore
          retention-days: 14
