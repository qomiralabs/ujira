name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # The pnpm package is a small shim; the binary that runs is the one from
  # @pnpm/exe.linux-x64. This is the SHA-512 of the `pnpm` file in that
  # package's tarball for PNPM_VERSION, which must match package.json.
  PNPM_VERSION: 12.14.0
  # Quoted so YAML never reads an all digit hash as a number.
  PNPM_EXE_SHA512: '31d634f13f80f983b91922b35388744a11f5a3909f14b104f2aabb71cbff135e6ffc4db68f1192641da41a52f9296fb8377cd6d66bc009b73d0e4d54fc87df3d'

jobs:
  # One job on purpose: a single runner and a single install keeps billed
  # minutes low on a private repo.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Runs before anything else executes pnpm (setup-node's pnpm cache
      # calls it). action-setup checks the download only against registry
      # metadata, so the binary on PATH is held to a hash pinned here.
      - name: Verify pnpm binary
        run: |
          grep -Fq "\"packageManager\": \"pnpm@${PNPM_VERSION}+sha512." package.json
          bin="$(realpath "$(command -v pnpm)")"
          echo "pnpm resolves to ${bin}"
          echo "${PNPM_EXE_SHA512}  ${bin}" | sha512sum --check --strict
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on any dependency outside the license allowlists, then fails
      # again if the committed notices are out of date.
      - name: Licenses
        run: |
          pnpm licenses:check
          git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test

      # Upload even when tests fail so a threshold miss can be inspected. A
      # missing report is only an error when everything before this passed.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14

      # The build uses its own tsconfig, so typecheck passing does not prove
      # the packages compile for release.
      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod
