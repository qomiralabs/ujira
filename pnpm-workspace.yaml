packages:
  - packages/*
  - apps/*

engineStrict: true

# Install scripts stay off unless reviewed. These come in through the Docker
# client used by testcontainers and work without their scripts: cpu-features
# is an optional native speedup for ssh2, and the protobufjs script only
# prints a version check.
allowBuilds:
  cpu-features: false
  # Storybook bundles with esbuild. Its script only checks that the platform
  # binary from the matching optional package is in place.
  esbuild: false
  protobufjs: false
  ssh2: false

# Holds transitive packages of the testcontainers tree to versions released
# at least two weeks ago. Drop each entry once the floating version is old
# enough.
overrides:
  '@grpc/grpc-js': 1.14.5
  '@types/dockerode': 4.0.1
  bare-fs: 4.8.2
  bare-url: 2.5.4
  readable-stream@4: 4.7.0
  testcontainers: 12.2.0
  # The WebAssembly builds of these native tools only matter on platforms
  # without a native binary, which nothing here runs on. Dropping them keeps
  # their bundled runtimes out of the lockfile.
  '@oxc-parser/binding-wasm32-wasi': '-'
  '@oxc-resolver/binding-wasm32-wasi': '-'
  '@tailwindcss/oxide-wasm32-wasi': '-'

# Supply chain: a version must be 14 days old (in minutes) before it can be
# installed or locked. `pnpm install --frozen-lockfile` re-checks every
# lockfile entry against this, so CI fails on a version that is too new.
minimumReleaseAge: 20160
# Fail instead of skipping the check when the registry cannot date a version.
minimumReleaseAgeIgnoreMissingTime: false
# Drop exclude entries once the lockfile no longer holds their version.
minimumReleaseAgeExcludePrune: true
# Exact versions only. New entries are for urgent security patches, each with
# a comment giving the reason.
minimumReleaseAgeExclude:
  # 2026-10-17 baseline: versions already locked when the release age was
  # introduced. Each entry drops out when its version leaves the lockfile.
  - '@asamuzakjp/css-color@7.1.5'
  - '@asamuzakjp/dom-selector@10.0.3'
  - '@babel/runtime@7.29.10'
  - '@bramus/specificity@2.4.3'
  - '@oxc-project/types@0.154.0'
  - '@rolldown/binding-android-arm-eabi@1.2.14'
  - '@rolldown/binding-android-arm64@1.2.14'
  - '@rolldown/binding-darwin-arm64@1.2.14'
  - '@rolldown/binding-darwin-x64@1.2.14'
  - '@rolldown/binding-freebsd-x64@1.2.14'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.14'
  - '@rolldown/binding-linux-arm64-gnu@1.2.14'
  - '@rolldown/binding-linux-arm64-musl@1.2.14'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.14'
  - '@rolldown/binding-linux-s390x-gnu@1.2.14'
  - '@rolldown/binding-linux-x64-gnu@1.2.14'
  - '@rolldown/binding-linux-x64-musl@1.2.14'
  - '@rolldown/binding-openharmony-arm64@1.2.14'
  - '@rolldown/binding-win32-arm64-msvc@1.2.14'
  - '@rolldown/binding-win32-x64-msvc@1.2.14'
  - '@turbo/darwin-64@2.11.8'
  - '@turbo/darwin-arm64@2.11.8'
  - '@turbo/linux-64@2.11.8'
  - '@turbo/linux-arm64@2.11.8'
  - '@turbo/windows-64@2.11.8'
  - '@turbo/windows-arm64@2.11.8'
  - '@types/node@24.19.2'
